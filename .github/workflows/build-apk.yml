name: بناء تطبيق أندرويد (APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/global-apps-improvements-mbx7yy

permissions:
  contents: write  # لازم لنشر الإصدار الذي يحمل الـAPK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # مفتاح التوقيع الثابت. بدونه يسقط البناء إلى مفتاح التنقيح، وهو
      # يُولَّد عشوائيًا في كل مُشغّل، فتخرج كل نسخة ببصمة مغايرة وترفض
      # أن تُثبَّت فوق سابقتها. هنا يتحدّد إن كان التحديث فوق الجهاز ممكنًا.
      - name: تجهيز مفتاح التوقيع
        id: signing
        # يقبل secrets و variables معًا، ويفضّل الأول.
        #
        # المكانان يبدوان متشابهين في الواجهة ويسهل الخلط بينهما، وفشل
        # البناء لأن القيمة في الخانة الأخرى إهدار وقت بلا فائدة. أما
        # الفارق الحقيقي فأمني: variables تُخزَّن نصًّا مكشوفًا ولا تُحجب
        # من السجلّات تلقائيًا — لذا نحجبها يدويًا أدناه.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
          FROM_VARS: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' && vars.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # الحجب أولًا وقبل أي شيء: قيمة من variables تُطبع خامًا في
          # السجلّ لو تسرّبت من أي أمر لاحق.
          if [ -n "$STORE_PASSWORD" ]; then echo "::add-mask::$STORE_PASSWORD"; fi
          if [ -n "$KEY_PASSWORD" ];   then echo "::add-mask::$KEY_PASSWORD";   fi
          if [ -n "$KEYSTORE_B64" ];   then echo "::add-mask::$KEYSTORE_B64";   fi

          if [ "$FROM_VARS" = "true" ]; then
            echo "::warning::المفتاح مقروء من Variables لا Secrets. يعمل، لكن قيمه مخزَّنة نصًّا مكشوفًا — انقلها إلى Secrets متى أمكن."
          fi

          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا ANDROID_KEYSTORE_BASE64 في secrets ولا في variables — سيُوقَّع بمفتاح التنقيح ولن يُحدّث النسخة المثبّتة."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/zol-release.jks
          cat > android/key.properties <<PROPS
          storeFile=zol-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      # قبل البناء لا بعده: نسخة تُصرَّف وهي مكسورة سلوكيًّا أسوأ من
      # نسخة لا تُبنى، لأنها تصل الجهاز.
      - name: التحليل الساكن
        run: flutter analyze --no-fatal-infos

      - name: الاختبارات
        run: flutter test --reporter compact

      # رقم التشغيل يتصاعد أبدًا، فكل نسخة أحدث من سابقتها. بدونه يبقى
      # versionCode ثابتًا على ١ ويرفض أندرويد التثبيت فوق نسخة بنفس الرقم.
      - name: بناء النسخة
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # البصمة هي الفرق بين تحديثٍ يُثبَّت وتحديثٍ يرفضه أندرويد بـ«لم يتم
      # التثبيت». وأندرويد لا يقبل تحديثًا موقَّعًا بمفتاح غير مفتاح النسخة
      # المثبَّتة — لا رسالةَ تشرح ذلك، بل فشلٌ صامت يظنّه التاجر عطبًا في
      # الملفّ.
      #
      # وهذه الخطوة كانت **لا تفحص شيئًا**: النجمة في `build-tools/*/apksigner`
      # تتوسّع إلى أكثر من إصدار مثبَّت، فيصير أوّلها أمرًا وبقيّتها وسائط،
      # فيردّ «Unsupported command» ويبتلعه `|| true`. مررنا بثمانية وستّين
      # بناءً ونحن نظنّ أننا نتحقّق.
      - name: التحقق من البصمة
        id: fingerprint
        run: |
          set -o pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk

          # أحدث إصدار مثبَّت من أدوات البناء، محدَّدًا لا مُوسَّعًا.
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null \
                   | sort -V | tail -n 1)
          if [ -z "$SIGNER" ]; then
            echo "::error::apksigner غير موجود — لا يمكن التحقق من البصمة."
            exit 1
          fi
          echo "الأداة: $SIGNER"

          # بلا `|| true`: فشلُ الفحص عطلٌ يجب أن يُرى لا أن يُبتلع.
          "$SIGNER" verify --print-certs "$APK" > certs.txt
          grep -i "Signer #1 certificate SHA-256\|Signer #1 certificate DN" certs.txt

          SHA=$(grep -i "Signer #1 certificate SHA-256" certs.txt \
                | head -n1 | sed 's/.*: *//')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "versionCode: ${{ github.run_number }}"

          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::warning::البصمة أعلاه عابرة — تتغيّر في كل بناء حتى تُضاف أسرار المفتاح، ولن يُثبَّت التحديث فوق نسخة سابقة."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zol-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      # الـArtifact يصل مضغوطًا ويتطلّب تسجيل دخول GitHub — وكلاهما عائق
      # على الجوال: تنزيل ناقص ثم فشل استخراج. الإصدار يعطي رابط ‎.apk‎
      # مباشرًا يفتحه مثبّت أندرويد بلا وسيط.
      - name: نشر إصدارًا للتحميل المباشر
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          APK="zol-${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          # البصمة في وصف الإصدار: حين يفشل التثبيت فوق نسخة قديمة يكون
          # السبب غالبًا اختلافها، ومقارنتها بما على الجهاز
          # (`adb shell dumpsys package com.zol.app | grep -i signature`
          # أو أي قارئ APK) تحسم السبب في دقيقة بدل تخمينٍ طويل.
          gh release create "$TAG" "$APK" \
            --title "zol — بناء ${{ github.run_number }}" \
            --notes "$(printf 'versionCode %s · من %s\n\nبصمة التوقيع (SHA-256):\n`%s`\n\nإن فشل التثبيت فوق نسخة مثبَّتة فبصمتها مختلفة — أزل القديمة ثم ثبّت هذه.' \
              "${{ github.run_number }}" "${GITHUB_SHA:0:7}" \
              "${{ steps.fingerprint.outputs.sha256 }}")" \
            --latest

      # صفحة الإصدارات تُنظَّف مع كل بناء: ستّون نسخة متراكمة تُربك من
      # يريد التثبيت، وتُبقي بناءات فيها أعطالٌ أُصلحت قابلةً للتنزيل.
      # الأحدث وحده يبقى، وما تجاوز سبعة أيام يُحذف على كل حال.
      - name: تقليم الإصدارات القديمة
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: '7'
          KEEP_MIN: '1'
          KEEP_MAX: '1'
        run: bash tool/prune_releases.sh

      - name: تنظيف المفتاح
        if: always()
        run: rm -f android/zol-release.jks android/key.properties
